<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#11110f" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Rossella Training · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#11110f;--paper:#f3efe6;--hot:#ff4f79;--muted:#8d897f}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--ink);font-family:"DM Sans",sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}.shell{width:min(460px,100%)}.brand{display:flex;align-items:center;gap:13px;color:white;margin:0 0 26px}.mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--hot);font:800 22px/1 "Manrope",sans-serif}.brand strong{font:800 13px/1.2 "Manrope",sans-serif;letter-spacing:.08em}.brand small{display:block;color:#aaa79f;margin-top:5px}.card{background:var(--paper);border-radius:28px;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--hot);margin:0 0 12px}.card h1{font:800 clamp(34px,8vw,50px)/.98 "Manrope",sans-serif;letter-spacing:-.05em;margin:0 0 12px}.intro{color:#69665f;line-height:1.55;margin:0 0 28px}.field{margin:16px 0}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;margin:0 0 8px}.field input{width:100%;border:1px solid #d7d1c5;background:#fff;border-radius:15px;padding:15px 16px;font:600 16px "DM Sans",sans-serif;outline:none}.field input:focus{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,79,121,.13)}button{width:100%;border:0;border-radius:999px;background:var(--hot);color:#11110f;padding:16px 20px;margin-top:9px;font:800 13px "Manrope",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{min-height:22px;color:#a32143;font-size:13px;font-weight:700;margin:12px 2px 0}.secure{color:#99958d;font-size:11px;text-align:center;margin:18px 0 0}@media(max-width:480px){body{padding:16px}.card{padding:28px 22px;border-radius:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><div class="mark">R</div><div><strong>ROSSELLA / TRAINING</strong><small>personal workout space</small></div></div>
    <section class="card">
      <p class="eyebrow">PRIVATE ACCESS</p>
      <h1>Welcome<br>back.</h1>
      <p class="intro">Accedi al tuo spazio personale per calendario, schede e progressioni.</p>
      <form id="loginForm" autocomplete="on">
        <div class="field"><label for="username">UTENTE</label><input id="username" name="username" autocomplete="username" required /></div>
        <div class="field"><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
        <button id="submitBtn" type="submit">Accedi</button>
        <div id="error" class="error" role="alert"></div>
      </form>
      <p class="secure">Accesso personale · nessuna registrazione disponibile</p>
    </section>
  </main>
  <script>
    (async()=>{try{const r=await fetch('/api/session',{credentials:'same-origin'});if(r.ok){location.replace('/');}}catch(e){}})();
    const form=document.getElementById('loginForm'), error=document.getElementById('error'), btn=document.getElementById('submitBtn');
    form.addEventListener('submit',async(e)=>{
      e.preventDefault(); error.textContent=''; btn.disabled=true; btn.textContent='Accesso…';
      try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:form.username.value,password:form.password.value})});
        if(!r.ok){const data=await r.json().catch(()=>({}));throw new Error(data.error||'Credenziali non corrette');}
        location.replace('/');
      }catch(err){error.textContent=err.message||'Impossibile effettuare l’accesso';btn.disabled=false;btn.textContent='Accedi';}
    });
  </script>
</body>
</html>
